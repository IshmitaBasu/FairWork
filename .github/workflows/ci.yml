name: FairWork checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and dashboard dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[audit,analysis,dashboard]"
      - name: Check Python syntax
        run: python -m compileall -q app.py src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
