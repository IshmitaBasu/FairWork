[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairwork"
version = "0.1.0"
description = "Reproducible exploratory analysis of political context and women's economic outcomes in Europe"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "FairWork contributors" }]
dependencies = []

[project.optional-dependencies]
audit = ["openpyxl>=3.1"]
pipeline = ["duckdb>=1.1,<2"]
dbt = ["dbt-core==1.8.9", "dbt-duckdb==1.8.4"]
analysis = ["duckdb>=1.1,<2", "matplotlib>=3.8"]
dev = []

[tool.pytest.ini_options]
testpaths = ["tests"]
